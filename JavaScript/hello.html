<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hello World</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelector('form').onsubmit = function() {
                    const name = document.querySelector('#name').value;
                    alert(`Hello, ${name}!`);
                    return false;
                };
            });
        </script>
    </head>
    <body>
        <h1>Hello World</h1>
        <form>
            <input autofocus id="name" placeholder="Enter your name" type="text">
            <input type="submit">
        </form>
</html>
