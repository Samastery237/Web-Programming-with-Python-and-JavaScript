<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Users App{% endblock %}</title>
    <style>
        .navbar {
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .navbar a {
            margin-left: 15px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
    
    <div class="navbar">
        {% if request.user.is_authenticated %}
            Signed in as <strong>{{ request.user.username }}</strong>.
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            Not signed in. 
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>

    <div style="padding: 15px;">
        {% block body %}
        {% endblock %}
    </div>

</body>
</html>
