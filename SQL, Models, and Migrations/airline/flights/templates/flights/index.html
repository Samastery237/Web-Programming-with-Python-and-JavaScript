{% extends "flights/layout.html" %}

{% block body %}
    <h1>Flights</h1>
    <ul>
        {% for flight in flights %}
            <li>
                <a href="{% url 'flights:flight' flight.id %}">
                    Flight {{ flight.id }}: {{ flight.origin.city }} to {{ flight.destination.city }}
                </a>
            </li>
        {% empty %}
            <li>No flights available.</li>
        {% endfor %}
    </ul>
{% endblock %}
